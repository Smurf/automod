name: build

# Build the automod HPC module stack for every supported OS (matrix below).
# Each matrix job builds the custom container image for its release with
# with podman, then compiles + validates every module inside that container.
# At the end the finished /opt/automod tree is uploaded as an artifact for
# deployment to the cluster.

on:
  push:
    branches: [main, master, initial]
    # v* tags additionally publish a GitHub release with the module trees
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly rebuild to catch upstream changes
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    name: modules (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "ubuntu-24.04"
          - image: "ubuntu-26.04"
          - image: "rocky-9"
    env:
      TAG: automod:${{ matrix.image }}
      TREE: modtree-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: make tree + intel dirs (podman mounts need them to exist)
        run: mkdir -p "$TREE" ".intel-${{ matrix.image }}"

      - name: build container image (podman)
        run: |
          podman build --quiet -t "$TAG" \
            -f "containers/${{ matrix.image }}/Containerfile" \
            "containers/${{ matrix.image }}"

      - name: image sanity check
        run: |
          podman run --rm --workdir /src -v "$PWD:/src" "$TAG" \
            bash -c 'set -e; \
                     gcc --version | grep -q ^gcc; \
                     gfortran --version | grep -q ^GNU; \
                     source /usr/share/lmod/lmod/init/bash && module --version'

      - name: mpich module
        run: podman run --rm --workdir /src -e LOGDIR=/src/.tmplogs -v "$PWD:/src" -v "$PWD/$TREE:/opt/automod" "$TAG" bash /src/build/mpich.sh

      - name: openmpi module
        run: podman run --rm --workdir /src -e LOGDIR=/src/.tmplogs -v "$PWD:/src" -v "$PWD/$TREE:/opt/automod" "$TAG" bash /src/build/openmpi.sh

      - name: netcdf module (serial + mpich + openmpi)
        run: podman run --rm --workdir /src -e LOGDIR=/src/.tmplogs -v "$PWD:/src" -v "$PWD/$TREE:/opt/automod" "$TAG" bash /src/build/netcdf.sh

      - name: sparta module (serial + mpich + openmpi)
        run: podman run --rm --workdir /src -e LOGDIR=/src/.tmplogs -v "$PWD:/src" -v "$PWD/$TREE:/opt/automod" "$TAG" bash /src/build/sparta.sh

      - name: intel oneapi + intel mpi modules
        # /opt/intel must persist across containers (installed by apt in this
        # step; the selftest in the next step mounts it again to use icx/ifx).
        run: podman run --rm --workdir /src -e LOGDIR=/src/.tmplogs -v "$PWD:/src" -v "$PWD/$TREE:/opt/automod" -v "$PWD/.intel-${{ matrix.image }}:/opt/intel" "$TAG" bash /src/build/oneapi.sh

      - name: selftest (lmod loads every module)
        run: podman run --rm --workdir /src -e LOGDIR=/src/.tmplogs -v "$PWD:/src" -v "$PWD/$TREE:/opt/automod" -v "$PWD/.intel-${{ matrix.image }}:/opt/intel" "$TAG" bash /src/build/selftest.sh

      - name: upload build logs (diagnostics)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.image }}
          path: .tmplogs/
          if-no-files-found: ignore

      - name: package module tree
        run: tar -czf "automod-modtree-${{ matrix.image }}.tar.gz" -C "$TREE" .

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: automod-modtree-${{ matrix.image }}
          path: automod-modtree-${{ matrix.image }}.tar.gz
          if-no-files-found: error

  release:
    # Publish the finished module trees as GitHub releases. The modules job
    # must pass for every matrix entry before anything is published:
    #   - v* tag push  -> versioned release with generated notes
    #   - main builds  -> rolling "latest" release, replaced on every build
    #     (also covers workflow_dispatch and the weekly schedule, which run
    #      on the default branch). PR runs build artifacts only.
    name: release (publish module trees)
    needs: modules
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: download built module trees (all OS releases)
        uses: actions/download-artifact@v4
        with:
          pattern: automod-modtree-*
          merge-multiple: true
          path: dist

      - name: checksums
        run: |
          cd dist
          sha256sum automod-modtree-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          files=(dist/automod-modtree-*.tar.gz dist/SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$TAG" \
              --title "automod module tree $TAG" \
              --generate-notes \
              "${files[@]}"
          else
            notes="Rolling build of main at ${SHA:0:12}.

          Contains the finished module trees for every supported OS release;
          extract at / (trees live under /opt/automod) and register the
          modulefiles roots with \`module use\` — see the README."
            # replace the previous rolling release entirely (incl. its tag)
            gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create latest \
              --target "$SHA" \
              --title "automod module tree (latest)" \
              --notes "$notes" \
              "${files[@]}"
          fi
